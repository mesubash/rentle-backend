# Run everything:  docker compose up -d --build          (uses .env)
# Local override:  docker compose --env-file .env.local up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: rentle-postgres
    environment:
      POSTGRES_DB: rentle
      POSTGRES_USER: ${DB_USER:-rentle}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rentle}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rentle-redis
    ports: ["6380:6379"]
    restart: unless-stopped

  app:
    build: .
    container_name: rentle-backend
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8091:8080"]   # 8083 was taken by travel-buddy-app on the VPS
    volumes: ["privatefiles:/var/lib/rentle"]   # KYC docs + deposit proofs (not on Cloudinary)
    restart: unless-stopped

volumes:
  pgdata:
  privatefiles:
