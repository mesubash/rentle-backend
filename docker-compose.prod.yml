# Production stack for the Rentle backend on a VPS: the app plus its Postgres and Redis.
# The frontend is deployed separately on Vercel and is not part of this compose.
#
# Run from this directory with the production env file (used for both variable
# interpolation and the app's runtime environment):
#
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
#
# Put a TLS reverse proxy (nginx / Caddy / Traefik) in front of app:8080 for api.rentle.online.

services:
  postgres:
    image: postgres:16-alpine
    container_name: rentle-postgres-prod
    environment:
      POSTGRES_DB: rentle
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d rentle"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rentle-redis-prod
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    container_name: rentle-backend-prod
    env_file: .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      # Persists private files (KYC docs, deposit proofs). Public images go to Cloudinary.
      - rentle_files:/var/lib/rentle
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  rentle_files:
