spring:
  application:
    name: rentle-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/rentle}
    username: ${DB_USER:rentle}
    password: ${DB_PASSWORD:dev_password}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.default_batch_fetch_size: 20

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

  # SMTP is only used when rentle.email=smtp. Host/credentials are env-driven; blank in dev.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

# KYC submits ~17 form fields + 2 files as multipart parts; raise Tomcat's default
# part/parameter limits so the whole form is accepted.
server:
  tomcat:
    max-part-count: 60
    max-parameter-count: 100

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus   # Prometheus scrape at /actuator/prometheus
  health:
    mail:
      enabled: ${MAIL_HEALTH:false}   # the mail starter pings SMTP on startup; off unless a real host is set
  metrics:
    tags:
      application: rentle-backend

rentle:
  platform-fee-percent: 0   # free launch (docs/13); admin raises it via platform settings when monetization turns on
  review-window-days: 30
  otp-expiry-minutes: 10
  max-listing-images: 5
  storage: ${RENTLE_STORAGE:local}
  local-upload-dir: ${RENTLE_UPLOAD_DIR:uploads}
  sms: ${RENTLE_SMS:logging}
  email: ${RENTLE_EMAIL:logging}          # logging | smtp
  mail-from: ${RENTLE_MAIL_FROM:no-reply@rentle.app}
  private-upload-dir: ${RENTLE_PRIVATE_UPLOAD_DIR:private-uploads}
  demo-seed: ${RENTLE_SEED_DEMO:true}
  app-url: ${RENTLE_APP_URL:http://localhost:3000}
  api-base-url: ${RENTLE_API_BASE_URL:http://localhost:8080}
  # Dev delivery for OTP codes and email verification links (no SMS/email provider yet).
  discord-webhook: ${RENTLE_DISCORD_WEBHOOK:}
  iam:
    enabled: true
    sync-catalog: true
    bootstrap-super-admin-email: ${RENTLE_IAM_SUPER_ADMIN_EMAIL:}

# Backend-driven Google OAuth (Authorization Code flow — no client config in the
# frontend). Set all three to enable /auth/google/login.
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}
  redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/google/callback}

jwt:
  # PEM strings; blank = ephemeral dev keypair generated at startup
  private-key: ${JWT_PRIVATE_KEY:}
  public-key: ${JWT_PUBLIC_KEY:}
  access-token-expiry-ms: 900000
  refresh-token-expiry-ms: 604800000

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

sms:
  sparrow:
    token: ${SPARROW_SMS_TOKEN:}
    from: ${SPARROW_SMS_FROM:Rentle}
