# Production profile: no dev fallbacks. Every value comes from the environment, so a missing
# secret fails the boot loudly instead of silently starting with a dev default.
# Activate with SPRING_PROFILES_ACTIVE=prod (the Dockerfile sets it).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  # SMTP is optional (email is off by default — Discord handles events). Blank host = no mail sender.
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

rentle:
  # Real secrets fail fast (no default); optional integrations default to off.
  storage: ${RENTLE_STORAGE}            # required — 'cloudinary' in prod
  app-url: ${RENTLE_APP_URL}            # required
  api-base-url: ${RENTLE_API_BASE_URL}  # required
  sms: ${RENTLE_SMS:logging}            # 'sparrow' to enable real SMS
  email: ${RENTLE_EMAIL:logging}        # 'smtp' to enable real email
  mail-from: ${RENTLE_MAIL_FROM:no-reply@rentle.online}

# Google sign-in (required in prod; set the OAuth client from Google Cloud Console).
google:
  client-id: ${GOOGLE_CLIENT_ID}
  client-secret: ${GOOGLE_CLIENT_SECRET}
  redirect-uri: ${GOOGLE_REDIRECT_URI}

# JWT keys are required — a blank key generating an ephemeral keypair (dev behavior) would log
# every user out on each restart and cannot scale past one instance.
jwt:
  private-key: ${JWT_PRIVATE_KEY}
  public-key: ${JWT_PUBLIC_KEY}

# Structured JSON logs for prod aggregation (Spring Boot native structured logging).
logging:
  structured:
    format:
      console: ecs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus   # metrics endpoints reachable only on the internal network/proxy
